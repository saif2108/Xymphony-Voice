[project]
name = "xymphony-tools"
version = "0.1.0"
description = "Provider-neutral tool domain, registry, and execution boundary for Xymphony Voice"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "xymphony-contracts",
]

[tool.uv.sources]
xymphony-contracts = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xymphony_tools"]
