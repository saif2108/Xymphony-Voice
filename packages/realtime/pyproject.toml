[project]
name = "xymphony-realtime"
version = "0.1.0"
description = "Media transport adapters for Xymphony Voice (LiveKit)"
requires-python = ">=3.12"
dependencies = [
    "xymphony-contracts @ file:packages/contracts",
    "livekit>=0.17",
    "livekit-api>=0.8",
]

[tool.uv.sources]
xymphony-contracts = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xymphony_realtime"]
