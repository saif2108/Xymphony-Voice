[project]
name = "xymphony-rag"
version = "0.1.0"
description = "Knowledge retrieval and RAG components for Xymphony Voice"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xymphony_rag"]
