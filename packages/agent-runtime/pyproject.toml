[project]
name = "xymphony-agent-runtime"
version = "0.1.0"
description = "Xymphony Voice agent runtime session orchestration"
requires-python = ">=3.12"
dependencies = [
    "xymphony-contracts",
    "xymphony-tools",
]

[tool.uv.sources]
xymphony-contracts = { workspace = true }
xymphony-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xymphony_runtime"]
