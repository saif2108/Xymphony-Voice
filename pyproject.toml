[project]
name = "xymphony-voice"
version = "0.1.0"
description = "Xymphony Voice — platform for realtime AI agents (monorepo)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "xymphony-contracts",
    "xymphony-api",
    "xymphony-realtime",
    "xymphony-agent-runtime",
    "xymphony-runtime-worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/realtime",
    "packages/agent-runtime",
    "packages/providers",
    "apps/api",
    "apps/runtime-worker",
]

[tool.uv.sources]
xymphony-contracts = { workspace = true }
xymphony-api = { workspace = true }
xymphony-realtime = { workspace = true }
xymphony-agent-runtime = { workspace = true }
xymphony-providers = { workspace = true }
xymphony-runtime-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [
    "packages/contracts/src",
    "packages/realtime/src",
    "packages/agent-runtime/src",
    "packages/providers/src",
    "apps/api/src",
    "apps/runtime-worker/src",
    ".",
]
markers = [
    "livekit: optional LiveKit Cloud integration tests",
    "openai: optional OpenAI integration tests",
    "assemblyai: optional AssemblyAI integration tests",
    "elevenlabs: optional ElevenLabs integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/contracts/src",
    "packages/realtime/src",
    "packages/agent-runtime/src",
    "packages/providers/src",
    "apps/api/src",
    "apps/runtime-worker/src",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"apps/api/src/xymphony_api/deps.py" = ["B008"]
"apps/api/src/xymphony_api/routes/*.py" = ["B008"]
"apps/api/alembic/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/contracts/src,packages/realtime/src,packages/agent-runtime/src,packages/providers/src,apps/api/src,apps/runtime-worker/src"
packages = [
    "xymphony_contracts",
    "xymphony_realtime",
    "xymphony_runtime",
    "xymphony_providers",
    "xymphony_api",
    "xymphony_runtime_worker",
]
plugins = ["pydantic.mypy"]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
