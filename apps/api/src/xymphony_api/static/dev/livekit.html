<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Xymphony Dev — LiveKit connectivity test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin-top: 1rem; }
      input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
      button { margin-top: 1rem; margin-right: 0.5rem; }
      #log { margin-top: 1.5rem; padding: 1rem; background: #111; color: #eee; min-height: 8rem; white-space: pre-wrap; font-size: 0.875rem; }
      .note { color: #666; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <h1>LiveKit connectivity test (development only)</h1>
    <p class="note">
      Xymphony uses LiveKit as <strong>media transport only</strong>, not as the agent runtime.
      This page verifies browser ↔ LiveKit room connectivity via the control-plane dev token endpoint.
    </p>
    <label>Room name <input id="room" value="xymphony-dev" /></label>
    <label>Participant identity <input id="identity" value="browser-user" /></label>
    <button id="connect">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <div id="log"></div>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script>
      const logEl = document.getElementById("log");
      const connectBtn = document.getElementById("connect");
      const disconnectBtn = document.getElementById("disconnect");
      let room = null;

      function log(message) {
        logEl.textContent += message + "\n";
      }

      async function mintToken(roomName, identity) {
        const params = new URLSearchParams({ room: roomName, identity });
        const response = await fetch(`/v1/dev/livekit/token?${params}`, { method: "POST" });
        if (!response.ok) {
          const body = await response.text();
          throw new Error(`Token request failed (${response.status}): ${body}`);
        }
        return response.json();
      }

      connectBtn.addEventListener("click", async () => {
        connectBtn.disabled = true;
        try {
          const roomName = document.getElementById("room").value.trim();
          const identity = document.getElementById("identity").value.trim();
          log("Requesting dev token...");
          const token = await mintToken(roomName, identity);
          log(`Connecting to ${token.url} room=${token.room_name} identity=${token.identity}`);
          room = new LivekitClient.Room();
          room.on(LivekitClient.RoomEvent.ParticipantConnected, (p) => log(`Participant joined: ${p.identity}`));
          room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (p) => log(`Participant left: ${p.identity}`));
          room.on(LivekitClient.RoomEvent.Disconnected, () => log("Disconnected"));
          await room.connect(token.url, token.token);
          log("Connected");
          disconnectBtn.disabled = false;
        } catch (err) {
          log(String(err));
          connectBtn.disabled = false;
        }
      });

      disconnectBtn.addEventListener("click", async () => {
        if (room) {
          await room.disconnect();
          room = null;
        }
        disconnectBtn.disabled = true;
        connectBtn.disabled = false;
        log("Disconnected (local)");
      });
    </script>
  </body>
</html>
