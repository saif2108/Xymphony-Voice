[project]
name = "xymphony-runtime-worker"
version = "0.1.0"
description = "Xymphony Voice minimal realtime transport worker"
requires-python = ">=3.12"
dependencies = [
    "xymphony-agent-runtime",
    "xymphony-api",
    "xymphony-providers",
    "xymphony-realtime",
]

[project.scripts]
xymphony-runtime-worker = "xymphony_runtime_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xymphony_runtime_worker"]
